<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>HP 접힘 시뮬레이터 (React)</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
<style>
 body {font-family: Arial, sans-serif;}
 canvas {border:1px solid #ccc; margin-top:10px;}
 .controls {margin-top:10px;}
 textarea {width:300px; height:80px;}
 button {margin-right:5px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function HPSimulator(){
  const canvasRef = React.useRef(null);
  const statsRef = React.useRef(null);
  const [seq, setSeq] = React.useState("HPPHPPHPHPPH");
  const [JHH, setJHH] = React.useState(1);
  const [JPB, setJPB] = React.useState(1);
  const [WP, setWP] = React.useState(2);
  const [temp, setTemp] = React.useState(1);
  const [contactsText, setContactsText] = React.useState("1 10 0.9\n3 8 0.5");
  const [running, setRunning] = React.useState(false);
  const positionsRef = React.useRef([]);
  const contactsRef = React.useRef([]);
  const timerRef = React.useRef(null);

  const parseContacts = React.useCallback(text => {
    const lines = text.split(/\n/).map(l=>l.trim()).filter(l=>l);
    return lines.map(l=>{
      const parts = l.split(/[\s:,]+/);
      return {i:parseInt(parts[0])-1, j:parseInt(parts[1])-1, p:parseFloat(parts[2])};
    });
  }, []);

  const draw = React.useCallback(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const positions = positionsRef.current;
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for(const [x,y] of positions){
      if(x<minX)minX=x; if(x>maxX)maxX=x;
      if(y<minY)minY=y; if(y>maxY)maxY=y;
    }
    const scale=20;
    const offsetX = canvas.width/2 - ((minX+maxX)/2)*scale;
    const offsetY = canvas.height/2 - ((minY+maxY)/2)*scale;
    ctx.strokeStyle='#888';
    ctx.lineWidth=2;
    for(let i=0;i<positions.length-1;i++){
      const [x1,y1]=positions[i];
      const [x2,y2]=positions[i+1];
      ctx.beginPath();
      ctx.moveTo(x1*scale+offsetX,y1*scale+offsetY);
      ctx.lineTo(x2*scale+offsetX,y2*scale+offsetY);
      ctx.stroke();
    }
    for(let i=0;i<positions.length;i++){
      const [x,y]=positions[i];
      ctx.beginPath();
      ctx.arc(x*scale+offsetX,y*scale+offsetY,8,0,Math.PI*2);
      ctx.fillStyle = seq[i]==='H' ? '#e74c3c' : '#3498db';
      ctx.fill();
      ctx.strokeStyle='#333';
      ctx.stroke();
    }
  }, [seq]);

  const calcEnergy = React.useCallback((pos) => {
    const n = seq.length;
    let chh=0;
    const neighborCounts = new Array(n).fill(0);
    for(let i=0;i<n;i++){
      for(let j=i+1;j<n;j++){
        const dx = Math.abs(pos[i][0]-pos[j][0]);
        const dy = Math.abs(pos[i][1]-pos[j][1]);
        if(dx+dy===1 && Math.abs(i-j)>1){
          if(seq[i]==='H' && seq[j]==='H') chh++;
          if(seq[i]==='P') neighborCounts[i]++;
          if(seq[j]==='P') neighborCounts[j]++;
        }
      }
    }
    let pBury=0;
    for(let i=0;i<n;i++) if(seq[i]==='P' && neighborCounts[i]>=3) pBury++;
    let pull=0,pSum=0;
    for(const c of contactsRef.current){
      pSum += c.p;
      const d = Math.abs(pos[c.i][0]-pos[c.j][0]) + Math.abs(pos[c.i][1]-pos[c.j][1]);
      if(d===1) pull += c.p;
    }
    const energy = -JHH*chh + JPB*pBury - WP*pull;
    const agreement = pSum>0 ? pull/pSum : 0;
    let cx=0,cy=0;
    for(const [x,y] of pos){cx+=x; cy+=y;}
    cx/=n; cy/=n;
    let rg=0;
    for(const [x,y] of pos){rg += (x-cx)**2 + (y-cy)**2;}
    rg=Math.sqrt(rg/n);
    return {energy, chh, pBury, agreement, rg};
  }, [seq, JHH, JPB, WP]);

  const updateStats = React.useCallback(() => {
    const s = calcEnergy(positionsRef.current);
    statsRef.current.textContent = `E=${s.energy.toFixed(2)} | H-H=${s.chh} | P bury=${s.pBury} | Agreement=${(s.agreement*100).toFixed(1)}% | Rg=${s.rg.toFixed(2)}`;
  }, [calcEnergy]);

  const mcStep = React.useCallback(() => {
    const n = seq.length;
    const pivot = Math.floor(Math.random()*n);
    const [px,py] = positionsRef.current[pivot];
    const rotations = [ [0,1,-1,0], [0,-1,1,0], [-1,0,0,-1] ];
    const r = rotations[Math.floor(Math.random()*rotations.length)];
    const newPos = positionsRef.current.map(p=>p.slice());
    for(let i=pivot+1;i<n;i++){
      const dx = positionsRef.current[i][0]-px;
      const dy = positionsRef.current[i][1]-py;
      const nx = px + r[0]*dx + r[1]*dy;
      const ny = py + r[2]*dx + r[3]*dy;
      newPos[i] = [nx,ny];
    }
    const set = new Set(newPos.map(p=>p.join(',')));
    if(set.size<newPos.length) return;
    const oldE = calcEnergy(positionsRef.current).energy;
    const newE = calcEnergy(newPos).energy;
    const dE = newE - oldE;
    if(dE<=0 || Math.random()<Math.exp(-dE/temp)){
      positionsRef.current = newPos;
    }
  }, [seq, temp, calcEnergy]);

  const loop = React.useCallback(() => {
    for(let i=0;i<10;i++) mcStep();
    draw();
    updateStats();
  }, [mcStep, draw, updateStats]);

  const init = React.useCallback(() => {
    positionsRef.current = [];
    for(let i=0;i<seq.length;i++) positionsRef.current.push([i,0]);
    contactsRef.current = parseContacts(contactsText);
    draw();
    updateStats();
  }, [seq, contactsText, parseContacts, draw, updateStats]);

  React.useEffect(() => {
    if(running){
      init();
      timerRef.current = setInterval(loop,50);
      return () => clearInterval(timerRef.current);
    } else {
      clearInterval(timerRef.current);
    }
  }, [running, init, loop]);

  return (
    <div>
      <h1>HP 접힘 시뮬레이터</h1>
      <div className="controls">
        서열: <input value={seq} onChange={e=>setSeq(e.target.value)} size="30"/><br/>
        J<sub>HH</sub>: <input type="number" value={JHH} step="0.1" style={{width:'60px'}} onChange={e=>setJHH(parseFloat(e.target.value))}/>
        J<sub>P,bury</sub>: <input type="number" value={JPB} step="0.1" style={{width:'60px'}} onChange={e=>setJPB(parseFloat(e.target.value))}/>
        w<sub>pull</sub>: <input type="number" value={WP} step="0.1" style={{width:'60px'}} onChange={e=>setWP(parseFloat(e.target.value))}/>
        T: <input type="number" value={temp} step="0.1" style={{width:'60px'}} onChange={e=>setTemp(parseFloat(e.target.value))}/><br/>
        예측 접촉 (i j p 한 줄씩):<br/>
        <textarea value={contactsText} onChange={e=>setContactsText(e.target.value)} />
        <br/>
        <button onClick={()=>setRunning(true)} disabled={running}>시작</button>
        <button onClick={()=>setRunning(false)} disabled={!running}>정지</button>
      </div>
      <canvas ref={canvasRef} width="500" height="500"></canvas>
      <div ref={statsRef}></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HPSimulator />);
</script>
</body>
</html>
